spring.application.name=smart-clinic-management

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/smart_clinic_db
spring.datasource.username=postgres
spring.datasource.password=tukaram
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=your-secret-key-here-change-this-in-production-with-a-strong-key-at-least-256-bits-long
app.jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.smartclinic=DEBUG
